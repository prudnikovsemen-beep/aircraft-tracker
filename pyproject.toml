[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "aircraft-tracker"
version = "0.1.0"
description = "Aircraft tracker project"
authors = ["Semen <prudnikov.s.s@yandex.ru>"]
readme = "README.md"
packages = [
    { include = "src" },
]

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.34.2"
python-dotenv = "^1.2.2"
aiohttp = "^3.14.3"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
isort = "^5.13.2"
mypy = "^1.9.0"
black = "^26.5.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"          # можно заменить на "^9.0.0", если точно нужна 9-я версия
pytest-cov = "^7.1.0"
# requests убран из dev, он уже есть в основных
responses = "^0.26.3"

[tool.black]
line-length = 119
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
known_first_party = "src"
skip_glob = ["tests/*", "venv/*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
exclude = [
    "^tests/",
    "^venv/"
]

[tool.flake8]
max-line-length = 119
exclude = ["git", "__pycache__", "tests/", "venv/", "build/", ".env/", "Lib/site-packages"]
ignore = ["E203", "W503"]
extend-select = ["B,C,E,F,W,T4,B9"]
per-file-ignores = "__init__.py:F401"

[tool.coverage.run]
source = ["src"]
omit = [
    "main.py",
    "src/*/__init__.py"
]

[tool.coverage.report]
show_missing = true
fail_under = 75

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
